services:
  env-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    ports:
      - "18888"
    expose:
      - "19889"
      - "19890"
    networks:
      - "aspire"
    restart: "always"
  postgres-server:
    image: "docker.io/library/postgres:latest"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_SERVER_PASSWORD}"
    expose:
      - "5433"
    networks:
      - "aspire"
    restart: "always"
  apiservice:
    image: "${APISERVICE_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${APISERVICE_PORT}"
      ConnectionStrings__tauluftdb: "Host=postgres-server;Port=5433;Username=postgres;Password=${POSTGRES_SERVER_PASSWORD};Database=tauluftdb"
      TAULUFTDB_HOST: "postgres-server"
      TAULUFTDB_PORT: "5433"
      TAULUFTDB_USERNAME: "postgres"
      TAULUFTDB_PASSWORD: "${POSTGRES_SERVER_PASSWORD}"
      TAULUFTDB_URI: "postgresql://postgres:${POSTGRES_SERVER_PASSWORD}@postgres-server:5433/tauluftdb"
      TAULUFTDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres-server:5433/tauluftdb"
      TAULUFTDB_DATABASENAME: "tauluftdb"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://env-dashboard:19889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "apiservice"
    ports:
      - "5003:${APISERVICE_PORT}"
    networks:
      - "aspire"
    restart: "always"
  webfrontend:
    image: "${WEBFRONTEND_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${WEBFRONTEND_PORT}"
      APISERVICE_HTTP: "http://apiservice:${APISERVICE_PORT}"
      services__apiservice__http__0: "http://apiservice:${APISERVICE_PORT}"
      APISERVICE_HTTPS: "https://apiservice:${APISERVICE_PORT}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://env-dashboard:19889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "webfrontend"
    ports:
      - "5002:${WEBFRONTEND_PORT}"
    depends_on:
      apiservice:
        condition: "service_started"
    networks:
      - "aspire"
    restart: "always"
networks:
  aspire:
    driver: "bridge"
